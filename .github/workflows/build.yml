name: Build Grimoire

on:
  push:
    branches: [ master, main, master-dev ]
    tags:
      - 'v*'
      - '[0-9]+.*'
      - 'release*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for release (e.g. v2.0.3)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet packages
      run: nuget restore "Project Grimlite.sln"

    - name: Build solution
      run: msbuild "Project Grimlite.sln" /p:Configuration=Release /p:Platform="Any CPU" /p:TargetFrameworkVersion=v4.8 /m

    - name: Prepare files for upload
      shell: cmd
      run: |
        mkdir artifact
        copy /y bin\Release\Grimoire.exe artifact\
        if exist bin\Release\Grimoire.exe.config copy /y bin\Release\Grimoire.exe.config artifact\
        if exist bin\Release\ClientConfig.cfg copy /y bin\Release\ClientConfig.cfg artifact\
        if exist bin\Release\config.cfg copy /y bin\Release\config.cfg artifact\
        if exist bin\Release\CharSelect.cfg copy /y bin\Release\CharSelect.cfg artifact\
        if exist bin\Release\hotkeys.json copy /y bin\Release\hotkeys.json artifact\
        if exist bin\Release\Loader xcopy /E /I /Y bin\Release\Loader artifact\Loader
        if exist bin\Release\Resources xcopy /E /I /Y bin\Release\Resources artifact\Resources
        if exist Resources\Bots xcopy /E /I /Y Resources\Bots artifact\Bots
        if exist Resources\Notes xcopy /E /I /Y Resources\Notes artifact\Notes
        if exist Resources\Plugins xcopy /E /I /Y Resources\Plugins artifact\Plugins

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: Grimoire
        path: artifact

    - name: Create release archive
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.event.inputs.tag_name != '')
      shell: pwsh
      run: |
        $refName = if ("${{ github.event.inputs.tag_name }}" -ne "") { "${{ github.event.inputs.tag_name }}" } else { "${{ github.ref_name }}" }
        $zipName = "Grimlite-$refName.zip"
        Compress-Archive -Path artifact\* -DestinationPath $zipName
        echo "ARCHIVE_NAME=$zipName" >> $env:GITHUB_ENV

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true' && github.event.inputs.tag_name != '')
      with:
        tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        files: |
          ${{ env.ARCHIVE_NAME }}
          artifact/Grimoire.exe
        generate_release_notes: true